name: docverify-ai

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000}
        VITE_APP_NAME: ${VITE_APP_NAME:-DocVerify AI}
    image: docverify-ai-frontend:local
    container_name: docverify-ai-frontend
    restart: unless-stopped
    ports:
      - '${FRONTEND_HOST_PORT:-3000}:3000'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - docverify-net
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3000/']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: docverify-ai-backend:local
    container_name: docverify-ai-backend
    restart: unless-stopped
    ports:
      - '${BACKEND_HOST_PORT:-4000}:4000'
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-4000}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      SEED_ENABLED: ${SEED_ENABLED:-false}
      ALLOW_PRODUCTION_SEED: ${ALLOW_PRODUCTION_SEED:-false}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - docverify-net
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:4000/api/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  postgres:
    image: postgres:16-alpine
    container_name: docverify-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_HOST_PORT:-5434}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/01-init-test-db.sql:ro
    networks:
      - docverify-net
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: docverify-ai-qdrant
    restart: unless-stopped
    ports:
      - '${QDRANT_HOST_PORT:-6333}:6333'
      - '${QDRANT_GRPC_HOST_PORT:-6334}:6334'
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - docverify-net
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'bash -c "exec 3<>/dev/tcp/127.0.0.1/6333"',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

networks:
  docverify-net:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  uploads_data:
